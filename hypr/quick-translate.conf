# Crow Translate hotkey integration — see system-plan.md §5.11 and
# docs/superpowers/plans/2026-08-04-translation-utility.md. Source this
# file from your main hyprland.conf: `source = ~/nixos/hypr/quick-translate.conf`
# (path depends on where this repo is checked out).
#
# Wayland has no global-shortcut API of its own — Crow Translate's D-Bus
# method is the documented integration point for compositors like
# Hyprland that can bind arbitrary shell commands to keys (unlike GNOME,
# which needs its own separate global-shortcuts D-Bus portal setup).
#
# Syntax note (checked against wiki.hypr.land, 2026-08-04): this file uses
# the classic hyprlang `.conf` format (`exec-once =`, `bind =`, `source =`),
# which is still functional as of Hyprland 0.55 (released 2026-05-09) — a
# hyprland.conf is loaded as before as long as no hyprland.lua is present.
# BUT: as of 0.55, hyprlang is officially deprecated in favor of a new
# Lua-based config (hyprland.lua), and the old .conf format is slated to
# be dropped after roughly 1-2 more releases. This snippet was written for
# a repo whose whole Hyprland module (hyprland/ dir, hyprlock/hypridle/
# hyprpaper configs — see system-plan.md §3/§5.2) is still hyprlang-based,
# so switching just this file to Lua would be inconsistent and is out of
# scope here. Whoever migrates the rest of the Hyprland config to Lua
# should port this snippet (exec-once -> hl.on("hyprland.start", ...),
# bind -> hl.bind(...)) at the same time — check the current wiki, since
# Lua bind/exec syntax may still be evolving.

# Crow Translate needs to be running for its D-Bus service to answer —
# launch it hidden/minimized-to-tray at session start rather than
# requiring a manual launch before the hotkey works.
exec-once = crow-translate

# Translate the current text selection on hotkey press.
#
# MANUAL VERIFICATION REQUIRED (agent cannot check this — no visual/runtime
# access to a running Hyprland session, per CLAUDE.md): confirm the hotkey
# actually fires, the translation popup appears, and $mainMod+T does not
# collide with another existing bind in your hyprland.conf. Tracked as a
# follow-up in the task-3 README.
bind = $mainMod, T, exec, gdbus call --session --dest io.crow_translate.CrowTranslate --object-path /io/crow_translate/CrowTranslate/MainWindow --method io.crow_translate.CrowTranslate.MainWindow.translateSelection
